# Test settings. Run from the backend folder with:  pytest
[pytest]
testpaths = tests
# Puts the backend folder on the import path, so tests can `import app`.
pythonpath = .
# Treats every `async def` test and fixture as async without a marker on each.
asyncio_mode = auto
# One event loop for the whole run. The app's connection pool is shared by all
# tests, and an asyncpg connection only works on the loop that opened it.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
